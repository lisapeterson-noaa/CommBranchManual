project: 
  type: website

website: 
  page-navigation: true
  title: "NOAA quarto simple" 
  site-url: "https://lisapeterson-noaa.github.io/CommBranchManual/" 
  repo-url: "https://github.com/lisapeterson-noaa.github.io/CommBranchManual"
  repo-actions: [edit, source, issue]
  favicon: images/favicon.ico
  
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"
  
  sidebar:
    background: "#D9E3E4"
    logo: "https://upload.wikimedia.org/wikipedia/commons/7/79/NOAA_logo.svg"
    favicon: images/favicon.ico
    pinned: true
    align: center
    tools: 
      - icon: globe
        href: https://nmfs-ost.github.io
        text: "NMFS Office of Science and Technology"
      - icon: github
        href: https://github.com/lisapeterson-noaa.github.io/CommBranchManual
        text: "NMFS OST Commercial Fisheries Statistics"

    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Home
      - href: content/FIS.qmd
        text: Fisheries Information System Program
      - section: content/DataSets.qmd
        text: Data Sets
        contents: 
          - href: content/CommercialLandings.qmd
            text: Commercial Landings
          - href: content/ForeignTrade.qmd
            text: Foreign Trade
          - href: content/ProcessedProducts.qmd
            text: Processed Products
          - href: content/PCC.qmd
            text: Per Capita Consumption
          - href: content/Supply.qmd
            text: Supply
          - href: content/USCGVessels.qmd
            text: USCG Vessels
          - href: content/Aquaculture.qmd
            text: Aquaculture
      - href: content/ProcessedProductsSurvey.qmd
        text: Processed Products Survey
      - section: content/Reports.qmd
        text: Reports
        contents: 
          - href: content/FOSS.qmd
            text: Fisheries One Stop Shop
          - href: content/FUS.qmd
            text: Fisheries of the United States
      - section: "Optional Pages"
        contents: 
          - content/MeetOurTeam.qmd
          - content/PublicationsPresentations.qmd
          - content/Resources.qmd
     
format:
  html:
    theme:
      light: [cosmo, theme.scss] 
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    toc: true


filters:
  - include-files.lua
  - quarto

  
